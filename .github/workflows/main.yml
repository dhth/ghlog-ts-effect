name: main

on:
  push:
    branches:
      - main

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      ts: ${{ steps.filter.outputs.ts }}
      workflows: ${{ steps.filter.outputs.workflows }}
      yml: ${{ steps.filter.outputs.yml }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            ts:
              - "src/**"
              - "mise.toml"
              - "mise.lock"
              - "biome.json"
              - "package-lock.json"
              - "package.json"
              - "tsconfig*.json"
              - "vitest.config.ts"
              - ".github/workflows/main.yml"
            workflows:
              - ".github/workflows/**/*.yml"
              - "mise.toml"
              - "mise.lock"
            yml:
              - "**/*.yml"
              - "**/*.yaml"
              - "mise.toml"
              - "mise.lock"

  build:
    needs: changes
    if: ${{ needs.changes.outputs.ts == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up mise
        uses: jdx/mise-action@v4
        with:
          install_args: --locked node
      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-
      - name: Install
        run: mise run deps
      - name: Run checks
        run: mise run lint:ci
      - name: Run tests
        run: mise run test
      - name: Build
        run: mise run build

  lint-yaml:
    needs: changes
    if: ${{ needs.changes.outputs.yml == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up mise
        uses: jdx/mise-action@v4
        with:
          install_args: --locked yamlfmt
      - name: Lint YAML
        run: mise run lint:yaml

  lint-workflows:
    needs: changes
    if: ${{ needs.changes.outputs.workflows == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up mise
        uses: jdx/mise-action@v4
        with:
          install_args: --locked actionlint
      - name: Lint workflows
        run: mise run lint:actions
